name: release

# Turns a pushed vX.Y.Z tag into a published GitHub Release. The publish
# step doesn't re-run nekOS's own build -- build-check.yml already gates
# every push to master, and RELEASING.md's process is to only tag a commit
# that's already green there and has passed the manual Windows smoke test.
#
# It does build NekoShot + NekoPlayer here (companion-assets, below) and
# attach the results as release assets, so installs/updates on this tag can
# download prebuilt binaries instead of cloning the Flutter SDK and building
# on the end user's own machine (see provision/install-companions.sh).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  companion-assets:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Build NekoShot + NekoPlayer in a Void Linux container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              set -eu
              xbps-install -Suy xbps
              xbps-install -Suy
              xbps-install -Sy base-system git
              sh provision/setup-void.sh
              sh provision/install-companions.sh --from-source
              tar -C /opt/nekoshot -czf /repo/nekoshot-linux-x86_64.tar.gz .
              tar -C /opt/nekoplayer -czf /repo/nekoplayer-linux-x86_64.tar.gz .
            '

      - run: gh release upload "$GITHUB_REF_NAME" nekoshot-linux-x86_64.tar.gz nekoplayer-linux-x86_64.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
