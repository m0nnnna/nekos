; nekOS terminal palette -- mirrors common/theme.h so sakura (the only
; terminal app nekOS ships) reads as part of the same visual system instead
; of its own stock colors. Installed once per session by start-session.sh;
; scoped to colorset 1, sakura's default.
;
; Config keys verified against the installed sakura-3.8.9 binary (its man
; page doesn't document them) -- colorset%d_fore/back/curs, palette (colon-
; separated ANSI 0-15, matching the old Xresources' xterm*colorN entries),
; font, scroll_lines. Confirmed working via a live screenshot before this
; was wired into start-session.sh.
[sakura]
last_colorset=1
colorset1_fore=#EDEAF5
colorset1_back=#15121C
colorset1_curs=#FF8FB1
palette=#1B1725:#FF6B7A:#8FE3B0:#FFD98F:#6AA0E8:#FF8FB1:#7CD9D9:#EDEAF5:#4A4459:#FF97A4:#ABF0C6:#FFE6B0:#96C4F0:#FFB0CB:#A6E6E6:#FFFFFF
font=monospace 11
scroll_lines=10000
show_scrollbar=false
